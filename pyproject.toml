[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ope-conf"
version = "0.1.0"
description = "Breaking Point: when hidden confounding flips off-policy evaluation (sepsis-simulator study)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vraj Detroja" }]
# Exact pins; the full transitive lock is requirements-lock.txt.
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation against the original simulator and Monte Carlo (make validate)"]
addopts = "-m 'not slow'"
